apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garmindashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/acid0ikario/k8s-workloads.git
    targetRevision: master
    path: deployments/production/garmindashboard
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: garmindashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - NamespaceAutoConfirmation=true
