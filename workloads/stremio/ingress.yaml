apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stremio
  namespace: stremio
spec:
  ingressClassName: nginx
  rules:
  - host: stremio.127.0.0.1.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stremio
            port:
              number: 8080
  - host: stremio-server.127.0.0.1.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: stremio
            port:
              number: 11470
