apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: postgrest
type: Opaque
stringData:
  POSTGRES_PASSWORD: mysecretpassword
  AUTHENTICATOR_PASSWORD: mysecretpassword
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: postgrest
data:
  init.sql: |
    CREATE ROLE web_anon NOLOGIN;
    GRANT USAGE ON SCHEMA public TO web_anon;
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO web_anon;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO web_anon;

    CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD 'mysecretpassword';
    GRANT web_anon TO authenticator;

    CREATE TABLE IF NOT EXISTS public.todos (
      id SERIAL PRIMARY KEY,
      done BOOLEAN NOT NULL DEFAULT FALSE,
      task TEXT NOT NULL,
      due TIMESTAMPTZ
    );

    INSERT INTO public.todos (task) VALUES ('Prueba inicial de PostgREST'), ('Asegurar persistencia de datos');
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: postgrest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: postgrest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-init
        configMap:
          name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postgrest
spec:
  ports:
  - port: 5432
  selector:
    app: postgres
