apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: postgrest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
      - name: postgrest
        image: postgrest/postgrest:v12.0.2
        ports:
        - containerPort: 3000
        env:
        - name: PGRST_DB_URI
          value: "postgres://authenticator:mysecretpassword@postgres:5432/postgres"
        - name: PGRST_DB_SCHEMA
          value: "public"
        - name: PGRST_DB_ANON_ROLE
          value: "web_anon"
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest
  namespace: postgrest
spec:
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: postgrest
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: postgrest
  namespace: postgrest
spec:
  ingressClassName: nginx
  rules:
  - host: postgrest.192.168.0.24.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: postgrest
            port:
              number: 80
