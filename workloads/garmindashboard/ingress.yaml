apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garmindashboard
  namespace: garmindashboard
spec:
  ingressClassName: nginx
  rules:
  - host: garmin.127.0.0.1.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: garmindashboard
            port:
              number: 80
